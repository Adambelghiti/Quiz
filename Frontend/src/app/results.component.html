<div class="results-container">
  <div class="results-header">
    <h1>Quiz Results</h1>
  </div>

  <div *ngIf="loading" class="loading">
    <p>Loading results…</p>
  </div>

  <div *ngIf="error" class="error-message">{{ error }}</div>

  <ng-container *ngIf="results as r">
    <div class="winner-banner" *ngIf="r.winnerName; else noWinner">
      🏆 <strong>{{ r.winnerName }}</strong> wins!
    </div>
    <ng-template #noWinner>
      <div class="winner-banner">No winner this time – nobody scored.</div>
    </ng-template>

    <table class="score-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Player</th>
          <th>Correct</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of r.scores; let i = index" [class.winner]="isWinner(p.playerId)">
          <td>{{ i + 1 }}</td>
          <td>{{ p.name }}</td>
          <td>{{ p.correctAnswers }} / {{ r.totalRounds }}</td>
          <td>{{ p.score }}</td>
        </tr>
      </tbody>
    </table>

    <div class="actions-container">
      <button (click)="playAgain()" class="primary-button">Play Again</button>
      <button (click)="backToLobby()" class="secondary-button">Back to Lobby</button>
    </div>
  </ng-container>
</div>
