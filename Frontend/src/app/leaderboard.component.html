<div class="container">
  <div class="leaderboard-header">
    <h2>Leaderboard</h2>
    <div class="header-actions">
      <label for="limit">Show</label>
      <select id="limit" name="limit" [(ngModel)]="limit" (ngModelChange)="load()">
        <option [ngValue]="10">Top 10</option>
        <option [ngValue]="20">Top 20</option>
        <option [ngValue]="50">Top 50</option>
      </select>
      <button type="button" class="secondary-button" (click)="backToLobby()">Back to Lobby</button>
    </div>
  </div>

  <div *ngIf="loading">Loading leaderboard…</div>
  <div *ngIf="error" class="error-message">{{ error }}</div>

  <table class="leaderboard-table" *ngIf="!loading && !error">
    <thead>
      <tr>
        <th>#</th>
        <th>Player</th>
        <th>Games</th>
        <th>Wins</th>
        <th>Accuracy</th>
        <th>Total score</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let entry of entries; let i = index" [class.top]="i === 0">
        <td>{{ i + 1 }}</td>
        <td>{{ entry.name }}</td>
        <td>{{ entry.gamesPlayed ?? 0 }}</td>
        <td>{{ entry.wins ?? 0 }}</td>
        <td>{{ accuracy(entry) }}</td>
        <td>{{ entry.totalScore }}</td>
      </tr>
      <tr *ngIf="entries.length === 0">
        <td colspan="6" class="empty">No scores yet — be the first!</td>
      </tr>
    </tbody>
  </table>
</div>
