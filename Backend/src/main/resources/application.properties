spring.application.name=QuizGame

# Run as the development profile unless the operator explicitly chooses another
# one. This keeps the built-in JWT secret and demo seeding available for a
# fresh local checkout while production must still opt in via
# --spring.profiles.active=prod (or SPRING_PROFILES_ACTIVE=prod).
spring.profiles.default=dev

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server.port=8080

# ---------------------------------------------------------------------------
# File-based H2 database (development)
# Data is written to ./data/quizdb.mv.db and survives restarts.
# Tests override this with an in-memory database (application-test.properties).
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/quizdb;AUTO_SERVER=TRUE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Create/update the schema on startup without dropping existing data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# The Open Session In View anti-pattern keeps a Hibernate session open for the
# whole web request, hiding missing fetches and blurring transaction
# boundaries. It is disabled; data needed to render a response is mapped inside
# the service transaction (DTOs / eager element collections) instead.
spring.jpa.open-in-view=false

# Bean Validation on the entities describes the API contract and is enforced by
# @Valid and on flush; it must not feed into the generated DDL. Without this,
# Hibernate Validator turns @NotBlank/@NotNull into NOT NULL columns, which would
# change a freshly created schema while leaving an already-upgraded database
# untouched - the two would then behave differently.
spring.jpa.properties.hibernate.validator.apply_to_ddl=false

# ---------------------------------------------------------------------------
# CORS: comma-separated list of origins allowed to call the API.
# (Also configurable through the CorsConfig bean.)
# ---------------------------------------------------------------------------
app.cors.allowed-origins=http://localhost:4200,http://localhost:4300,http://127.0.0.1:4200

# ---------------------------------------------------------------------------
# JWT authentication
# The secret must be at least 32 characters (256 bits) for HS256.
# Override it in production by setting the APP_JWT_SECRET environment variable.
# Outside the dev/test/local profiles the application fails fast when this
# placeholder is still in use.
# ---------------------------------------------------------------------------
app.jwt.secret=${APP_JWT_SECRET:change-me-quizgame-development-secret-key-please-override}
app.jwt.expiration-ms=86400000

# ---------------------------------------------------------------------------
# Login rate limiting (brute-force protection)
# Once an (IP address, username) pair has failed `max-failures` logins within
# `window`, it is locked out for `lockout`. Durations are ISO-8601, so PT1M is
# one minute and PT5M is five.
# ---------------------------------------------------------------------------
app.auth.login.max-failures=5
app.auth.login.window=PT1M
app.auth.login.lockout=PT5M
